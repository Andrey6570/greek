name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Проверка и сборка колоды
        run: python3 -I tools/build.py

      - name: Положить приложение в assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html manifest.webmanifest android/app/src/main/assets/
          cp -r data icons android/app/src/main/assets/

      - name: Ключ подписи
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Секрет SIGNING_KEYSTORE_BASE64 не задан: APK подписан debug-ключом, обновление поверх старой версии может не сработать"
          fi

      - name: Сборка APK
        working-directory: android
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon 2>&1 | tee ../build.log

      - name: Ошибки сборки в аннотации
        if: failure()
        run: |
          { grep -E "^e: |What went wrong|^> [^T]|[Ee]rror:|Could not" build.log | grep -v "^> Task"; } | sed 's#'"$GITHUB_WORKSPACE"'/##' > errors.txt || true
          split -b 3500 errors.txt chunk_ || true
          for f in chunk_*; do
            [ -f "$f" ] || continue
            echo "::error title=build $f::$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' "$f")"
          done

      - name: Переименовать APK и AAB
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "greek-1.0.${{ github.run_number }}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "greek-1.0.${{ github.run_number }}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: greek-apk
          path: |
            greek-*.apk
            greek-*.aab
          retention-days: 30

      - name: Релиз для скачивания на телефон
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" greek-*.apk greek-*.aab \
            --title "Ελληνικά 1.0.${{ github.run_number }}" \
            --notes "Сборка из ${GITHUB_SHA::7}. APK — для установки на телефон, AAB — для загрузки в Google Play." \
            --latest
