name: iOS build

on:
  push:
    branches: [main]
    paths: ['index.html', 'data/**', 'icons/**', 'package.json', 'capacitor.config.json', 'scripts/**', '.github/workflows/ios.yml', 'store/graphics/icon-1024.png']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Зависимости и сборка колоды
        run: |
          npm ci
          python3 -I tools/build.py

      - name: Проект iOS (Capacitor)
        run: |
          npm run prepare-www
          npx cap add ios
          npx cap sync ios
          cp store/graphics/icon-1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          PL=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Ελληνικά" $PL
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" $PL || true
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool false" $PL || true
          echo "Проект собран:"; ls ios/App

      - name: Сборка для симулятора (без подписи)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphonesimulator -derivedDataPath build/sim \
            MARKETING_VERSION=1.0 CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO build | tail -30
          cd build/sim/Build/Products/Release-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/greek-ios-simulator.zip" App.app

      - uses: actions/upload-artifact@v4
        with:
          name: greek-ios-simulator
          path: greek-ios-simulator.zip
          retention-days: 30

      - name: Неподписанный IPA для установки через AltStore / Sideloadly
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -derivedDataPath build/dev \
            MARKETING_VERSION=1.0 CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -15
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R build/dev/Build/Products/Release-iphoneos/App.app build/ipa/Payload/
          (cd build/ipa && zip -qry "$GITHUB_WORKSPACE/greek-ios-unsigned.ipa" Payload)
          ls -la greek-ios-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: greek-ios-ipa
          path: greek-ios-unsigned.ipa
          retention-days: 30

      - name: Релиз iOS (IPA для самостоятельной подписи)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create ios-latest greek-ios-unsigned.ipa \
            --title "Ελληνικά для iPhone (неподписанный IPA)" --prerelease --latest=false \
            --notes "Сборка из ${GITHUB_SHA::7}. Неподписанный IPA: поставьте через AltStore или Sideloadly со своим Apple ID (подпись действует 7 дней и обновляется через программу). Для App Store нужен Apple Developer Program, см. store/app-store.md."

      # Дальше шаги работают только когда добавлены секреты Apple Developer (см. store/app-store.md)
      - name: Архив и загрузка в TestFlight
        if: ${{ env.APPLE_TEAM_ID != '' && env.ASC_KEY_P8 != '' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -eo pipefail
          mkdir -p ~/private_keys && echo "$ASC_KEY_P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          KEY=~/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID MARKETING_VERSION=1.0 CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            archive | tail -20
          ls build/App.xcarchive
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID -authenticationKeyPath $KEY | tail -20
